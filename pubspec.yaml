name: personal_finance
description: "A commercial personal finance and debt management application."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  intl: ^0.20.2
  uuid: ^4.5.1
  local_auth: ^3.0.2
  crypto: ^3.0.7
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  http: ^1.6.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
